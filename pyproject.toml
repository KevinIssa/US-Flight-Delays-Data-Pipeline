[tool.poetry]
name = "domestic-flight-delays"
version = "0.1.0"
description = "data engineering project for processing flight data and analysing domestic flight delays"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
pyspark = "4.2.0"
pandas = "2.2.3"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)"
]
